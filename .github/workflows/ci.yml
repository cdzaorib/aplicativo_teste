name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Testes do banco e da coleta de ofertas (Postgres local)
        run: npm run test:supabase
      - name: Gerar bundles (Android, iOS e web)
        run: npx expo export --platform android --platform ios --platform web --output-dir dist
