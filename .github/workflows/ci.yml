name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tipos das Edge Functions (Deno)
        run: npm run typecheck:funcoes
      - run: npm run format:check
      - run: npm test -- --ci
      - name: Testes do banco e da coleta de ofertas (Postgres local)
        run: npm run test:supabase
      - name: Gerar bundles (Android, iOS e web)
        run: npx expo export --platform android --platform ios --platform web --output-dir dist
      - name: Navegador dos testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (versão web exportada acima)
        run: npx playwright test
      - name: Rastros dos testes de ponta a ponta que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-ponta-a-ponta
          path: test-results/
          retention-days: 7
